name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: 格式与静态检查
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
      - name: 测试
        run: go test ./... -count=1 -race
      - name: 构建
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o t2c ./cmd/t2c
